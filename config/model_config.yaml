# Model training configurations
random_seed: 42

spatial_cv:
  method: "group_kfold"  # Options: group_kfold, spatial_block, leave_region_out
  n_splits: 5
  group_col: "county_fips"
  # For spatial blocking
  block_size_km: 50

models:
  xgboost:
    n_estimators: 2000
    max_depth: 7
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_weight: 5
    tree_method: "hist"
    random_state: 42

  lightgbm:
    n_estimators: 2000
    max_depth: -1
    num_leaves: 63
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_samples: 20
    verbose: -1
    random_state: 42

  catboost:
    iterations: 2000
    depth: 7
    learning_rate: 0.01
    l2_leaf_reg: 3.0
    random_seed: 42
    verbose: 0

optuna:
  n_trials: 200
  timeout: 3600  # seconds per model

ensemble:
  method: "weighted_average"  # Options: weighted_average, stacking
  # Stacking meta-learner
  meta_model: "ridge"

submission:
  select_top_n: 2
  max_per_day: 10
  max_total: 300
