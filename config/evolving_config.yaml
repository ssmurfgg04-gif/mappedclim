# Self-evolving pipeline configuration
max_iterations: 10
target_col: building_gap
n_folds: 5
bias_penalty_weight: 0.3
feature_evolution: true

models:
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.7
    reg_alpha: 0.1
    reg_lambda: 1.0
    tree_method: hist
  lightgbm:
    n_estimators: 500
    max_depth: 6
    num_leaves: 31
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.7
    reg_alpha: 0.1
    reg_lambda: 1.0
    verbose: -1
  gradient_boosting:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8

tuning:
  learning_rate_range: [0.01, 0.2]
  max_depth_range: [3, 10]
  n_estimators_range: [200, 2000]
  subsample_range: [0.6, 1.0]
  colsample_range: [0.5, 1.0]
  reg_range: [0.001, 10.0]
