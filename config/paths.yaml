# Data paths and S3 configuration
s3_base: "s3://us-west-2.opendata.source.coop/humane-intelligence/bias-bounty-mapping-equity-challenge"
s3_region: "us-west-2"

# Overture Maps public S3
overture_s3: "s3://overturemaps-us-west-2/release"
overture_stac: "https://stac.overturemaps.org"

# Local data directories
local:
  raw: "data/raw"
  processed: "data/processed"
  features: "data/features"
  output: "data/output"

# Focus regions with bounding boxes
focus_regions:
  maricopa_az:
    bbox: [-112.8, 33.0, -111.2, 34.1]
    state_fips: "04"
    county_fips: "013"
  northern_ca:
    bbox: [-123.5, 38.5, -120.0, 41.5]
    states: ["CA"]
  eastern_ok:
    bbox: [-96.0, 34.5, -94.0, 37.0]
    state_fips: "40"
  south_central_tx:
    bbox: [-100.5, 28.0, -97.5, 30.0]
    state_fips: "48"

# National strata table
national_strata: "national-strata-tract-table.parquet"
